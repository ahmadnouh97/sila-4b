[project]
name = "sila-4b"
version = "0.1.0"
description = "Reproducible Arabic tool-calling fine-tuning and evaluation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.5",
]
training = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.0.1",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "peft>=0.21.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "trl>=1.14.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
