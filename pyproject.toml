[project]
name = "sila-4b"
version = "0.1.0"
description = "Reproducible Arabic tool-calling fine-tuning and evaluation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest==8.4.1",
    "ruff==0.12.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
